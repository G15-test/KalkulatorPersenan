<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Bagi Hasil</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            text-align: center;
            margin-top: 0;
            color: var(--primary-color);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }
        .flex-inputs {
            display: flex;
            gap: 15px;
        }
        .flex-inputs .form-group {
            flex: 1;
        }
        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #f8fafc;
            border-left: 4px solid var(--primary-color);
            border-radius: 4px;
            display: none;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 15px;
        }
        .result-item.total {
            font-weight: bold;
            border-top: 1px solid #e2e8f0;
            padding-top: 8px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Kalkulator Bagi Hasil</h2>
    
    <div class="form-group">
        <label for="pendapatan">Total Pendapatan (Rp)</label>
        <input type="number" id="pendapatan" placeholder="Contoh: 10000000" required>
    </div>
    
    <div class="form-group">
        <label for="pengeluaran">Total Pengeluaran/Modal (Rp)</label>
        <input type="number" id="pengeluaran" placeholder="Contoh: 4000000" value="0">
    </div>
    
    <div class="flex-inputs">
        <div class="form-group">
            <label for="persenA">Nisbah Pihak A (%)</label>
            <input type="number" id="persenA" placeholder="Contoh: 60" value="50" min="0" max="100" oninput="sinkronisasiPersen('A')">
        </div>
        <div class="form-group">
            <label for="persenB">Nisbah Pihak B (%)</label>
            <input type="number" id="persenB" placeholder="Contoh: 40" value="50" min="0" max="100" oninput="sinkronisasiPersen('B')">
        </div>
    </div>
    
    <button onclick="hitungBagiHasil()">Hitung Pembagian</button>
    
    <div class="result-box" id="resultBox">
        <div class="result-item">
            <span>Keuntungan Bersih:</span>
            <span id="resSisa">Rp 0</span>
        </div>
        <div class="result-item total">
            <span>Bagian Pihak A:</span>
            <span id="resA">Rp 0</span>
        </div>
        <div class="result-item total">
            <span>Bagian Pihak B:</span>
            <span id="resB">Rp 0</span>
        </div>
    </div>
</div>

<script>
    // Fungsi otomatis agar total persentase Pihak A + Pihak B selalu 100%
    function sinkronisasiPersen(pihak) {
        const persenA = document.getElementById('persenA');
        const persenB = document.getElementById('persenB');
        
        if (pihak === 'A') {
            let val = 100 - parseFloat(persenA.value || 0);
            persenB.value = val < 0 ? 0 : (val > 100 ? 100 : val);
        } else {
            let val = 100 - parseFloat(persenB.value || 0);
            persenA.value = val < 0 ? 0 : (val > 100 ? 100 : val);
        }
    }

    // Fungsi format angka ke Rupiah
    function formatRupiah(angka) {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka);
    }

    // Fungsi utama perhitungan sesuai rumus
    function hitungBagiHasil() {
        const pendapatan = parseFloat(document.getElementById('pendapatan').value || 0);
        const pengeluaran = parseFloat(document.getElementById('pengeluaran').value || 0);
        const persenA = parseFloat(document.getElementById('persenA').value || 0);
        const persenB = parseFloat(document.getElementById('persenB').value || 0);
        
        // Validasi input dasar
        if (pendapatan <= 0) {
            alert("Silakan masukkan total pendapatan terlebih dahulu.");
            return;
        }
        
        // Eksekusi rumus matematika
        const keuntunganBersih = pendapatan - pengeluaran;
        const bagianA = keuntunganBersih * (persenA / 100);
        const bagianB = keuntunganBersih * (persenB / 100);
        
        // Tampilkan box hasil
        document.getElementById('resultBox').style.display = 'block';
        
        // Cetak hasil ke layar
        document.getElementById('resSisa').innerText = formatRupiah(keuntunganBersih);
        document.getElementById('resA').innerText = formatRupiah(bagianA);
        document.getElementById('resB').innerText = formatRupiah(bagianB);
    }
</script>
</body>
</html>
