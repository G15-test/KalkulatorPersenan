<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revenue Sharing Calculator</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            text-align: center;
            margin-top: 0;
            color: var(--primary-color);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }
        .flex-inputs {
            display: flex;
            gap: 15px;
        }
        .flex-inputs .form-group {
            flex: 1;
        }
        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #f8fafc;
            border-left: 4px solid var(--primary-color);
            border-radius: 4px;
            display: none;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 15px;
        }
        .result-item.tax {
            color: #dc2626;
            font-size: 13px;
            padding-left: 10px;
            margin-top: -4px;
        }
        .result-item.total {
            font-weight: bold;
            border-top: 1px solid #e2e8f0;
            padding-top: 8px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Revenue Sharing Calculator</h2>
    
    <div class="form-group">
        <label for="pendapatan">Total Revenue (Rp)</label>
        <!-- Mengubah type menjadi text agar bisa disisipkan format ribuan saat diketik -->
        <input type="text" id="pendapatan" placeholder="Contoh: 30.000.000" oninput="formatInputRupiah(this)" required>
    </div>
    
    <div class="form-group">
        <label for="pengeluaran">Total Expenditure/Capital (Rp)</label>
        <input type="text" id="pengeluaran" placeholder="Contoh: 0" value="0" oninput="formatInputRupiah(this)">
    </div>
    
    <div class="flex-inputs">
        <div class="form-group">
            <label for="persenA">Nisbah Party A (%)</label>
            <input type="number" id="persenA" value="40" min="0" max="100" oninput="sinkronisasiPersen('A')">
        </div>
        <div class="form-group">
            <label for="persenB">Nisbah Party B (%)</label>
            <input type="number" id="persenB" value="60" min="0" max="100" oninput="sinkronisasiPersen('B')">
        </div>
    </div>
    
    <button onclick="hitungBagiHasil()">Calculate Division</button>
    
    <div class="result-box" id="resultBox">
        <div class="result-item">
            <span>Net Advantages:</span>
            <span id="resSisa">Rp 0</span>
        </div>
        
        <div class="result-item total">
            <span>Part of Party A (Kotor):</span>
            <span id="resAKotor">Rp 0</span>
        </div>
        <div class="result-item tax">
            <span>Pajak Makanan & Minuman (10%):</span>
            <span id="resAPajak">-Rp 0</span>
        </div>
        <div class="result-item total" style="color: #16a34a;">
            <span>Part of Party A (Bersih):</span>
            <span id="resABersih">Rp 0</span>
        </div>
        
        <div class="result-item total">
            <span>Part B:</span>
            <span id="resB">Rp 0</span>
        </div>
    </div>
</div>

<script>
    // Fungsi untuk memformat input secara real-time dengan titik pemisah ribuan
    function formatInputRupiah(input) {
        let value = input.value.replace(/[^0-9]/g, ''); // Hapus semua karakter non-angka
        if (value === "") {
            input.value = "0";
            return;
        }
        // Ubah string angka menjadi format ribuan dengan titik
        input.value = new Intl.NumberFormat('id-ID').format(parseInt(value));
    }

    // Fungsi mengambil nilai murni (angka saja) dari input teks yang berformat titik
    function getNilaiMurni(idUmpan) {
        let val = document.getElementById(idUmpan).value;
        return parseFloat(val.replace(/\./g, '')) || 0;
    }

    // Sinkronisasi otomatis persentase agar total tetap 100%
    function sinkronisasiPersen(pihak) {
        const persenA = document.getElementById('persenA');
        const persenB = document.getElementById('persenB');
        
        if (pihak === 'A') {
            let val = 100 - parseFloat(persenA.value || 0);
            persenB.value = val < 0 ? 0 : (val > 100 ? 100 : val);
        } else {
            let val = 100 - parseFloat(persenB.value || 0);
            persenA.value = val < 0 ? 0 : (val > 100 ? 100 : val);
        }
    }

    // Format output tampilan angka akhir ke Rupiah standar (Rp XX.XXX.XXX)
    function formatRupiahOutput(angka) {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka);
    }

    // Fungsi utama hitung pembagian dan pajak
    function hitungBagiHasil() {
        const pendapatan = getNilaiMurni('pendapatan');
        const pengeluaran = getNilaiMurni('pengeluaran');
        const persenA = parseFloat(document.getElementById('persenA').value || 0);
        const persenB = parseFloat(document.getElementById('persenB').value || 0);
        
        if (pendapatan <= 0) {
            alert("Silakan masukkan total revenue terlebih dahulu.");
            return;
        }
        
        // Perhitungan matematika dasar
        const keuntunganBersih = pendapatan - pengeluaran;
        const bagianAKotor = keuntunganBersih * (persenA / 100);
        const bagianB = keuntunganBersih * (persenB / 100);
        
        // Perhitungan komponen pajak 10% untuk Pihak A
        const pajakA = bagianAKotor * 0.10;
        const bagianABersih = bagianAKotor - pajakA;
        
        // Tampilkan kotak ringkasan hasil
        document.getElementById('resultBox').style.display = 'block';
        
        // Masukkan hasil perhitungan ke elemen antarmuka (UI)
        document.getElementById('resSisa').innerText = formatRupiahOutput(keuntunganBersih);
        document.getElementById('resAKotor').innerText = formatRupiahOutput(bagianAKotor);
        document.getElementById('resAPajak').innerText = "-" + formatRupiahOutput(pajakA);
        document.getElementById('resABersih').innerText = formatRupiahOutput(bagianABersih);
        document.getElementById('resB').innerText = formatRupiahOutput(bagianB);
    }
</script>
</body>
</html>
